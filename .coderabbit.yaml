# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
    profile: "assertive"
    request_changes_workflow: false
    high_level_summary: true
    poem: false
    review_status: true
    review_details: true
    collapse_walkthrough: true
    sequence_diagrams: true
    auto_review:
        enabled: true
        drafts: false
    path_filters:
        - "!vendor/**"
        - "!_ide_helper.php"
        - "!composer.lock"
    path_instructions:
        - path: "src/**"
          instructions: >
              This is a Laravel package (pocketarc/ai-workflow) built on the Laravel
              AI SDK (laravel/ai). Its public API uses the package's own message,
              response, tool, schema and exception types, and no laravel/ai types.
              The package runs its own tool loop on laravel/ai's gateways and sends
              OpenRouter calls through pocketarc/laravel-integrations, which
              provides the circuit breaker, retries and rate limiting. The package
              also has fallback models, YAML-based prompt management with Mustache
              templating, request logging with tagging, a replay engine, an eval
              framework, a middleware pipeline, caching, multimodal support, and
              Laravel Data integration. It requires PHP 8.3+ and Laravel 12.62+ or
              13.15+. PHPStan runs at level 10 with strict rules. The code narrows
              mixed values with runtime checks such as is_string() and is_array(),
              not with @var annotations or casts. Model identifiers are in
              `provider:model` format. The stored message JSON, schemas and cache
              keys must stay byte-identical to 6.x, and
              tests/UpgradeCompatibilityTest.php checks this.
    tools:
        gitleaks:
            enabled: true
        trufflehog:
            enabled: true
        shellcheck:
            enabled: true
        yamllint:
            enabled: true
        markdownlint:
            enabled: true
knowledge_base:
    code_guidelines:
        enabled: true
chat:
    auto_reply: true
